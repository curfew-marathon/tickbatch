name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: macos-latest
            goarch: arm64
          - os: windows-latest
            goarch: amd64
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: go test -v -race ./...

  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint config verify
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint config verify
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: govulncheck
        uses: golang/govulncheck-action@v1

  benchmark:
    name: Performance Enforcer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to fetch main for PR comparisons

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run PR Benchmarks
        run: go test -bench=. -benchmem -count=5 ./... | tee pr.out

      - name: Enforce zero-allocation contract
        shell: bash
        run: |
          awk '
            /allocs\/op/ {
              for (i = 1; i <= NF; i++) {
                if ($i == "allocs/op" && $(i-1) + 0 > 0) {
                  print "VIOLATION: " $0; found = 1
                }
              }
            }
            END { if (found) exit 1 }
          ' pr.out

      - name: Run Main Benchmarks & Compare (PR Only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git checkout "$BASE_REF"
          go test -bench=. -benchmem -count=5 ./... | tee main.out
          echo "=== Performance Delta (Main vs PR) ==="
          benchstat main.out pr.out
