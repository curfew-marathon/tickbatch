name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default — none of these jobs write anything.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: macos-latest
            goarch: arm64
          - os: windows-latest
            goarch: amd64
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: go test -v -race -cover ./...

  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    # golangci-lint and its config-verify install target @latest, which has
    # drifted ahead of go.mod's `go 1.25` (golangci-lint/v2 now requires
    # go >= 1.26). GOTOOLCHAIN=auto lets `go install` fetch the newer
    # toolchain on demand for these tool installs without raising the
    # module's own declared minimum Go version.
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint config verify
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint config verify
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: govulncheck
        uses: golang/govulncheck-action@v1

  benchmark:
    name: Performance Enforcer
    runs-on: ubuntu-latest
    # benchstat installs @latest, which now requires go >= 1.26 (ahead of
    # go.mod's `go 1.25`). GOTOOLCHAIN=auto (already used below for the
    # main-branch comparison checkout) lets this install fetch the newer
    # toolchain on demand instead of failing outright.
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to fetch main for PR comparisons

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Zero-Allocation Memory Gate
        shell: bash
        run: |
          go test -bench=BenchmarkPush -benchmem ./... > bench.txt
          grep 'BenchmarkPush' bench.txt \
            | awk '{ for(i=1;i<=NF;i++) if($i=="allocs/op" && $(i-1)+0>0) { print "VIOLATION:",$0; found=1 } } END { exit found+0 }'

      - name: Run PR Benchmarks
        run: go test -bench=. -benchmem -count=5 ./... | tee pr.out

      - name: Run Main Benchmarks & Compare (PR Only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git checkout "$BASE_REF"
          go test -bench=. -benchmem -count=5 ./... | tee main.out
          echo "=== Performance Delta (Main vs PR) ==="
          benchstat main.out pr.out
