version: "2"

linters:
  enable:
    - gocritic       # catches subtle Go pitfalls and style issues
    - godot          # enforces punctuation on GoDoc comments
    - revive         # GoDoc presence on all exported identifiers
    - misspell       # typos in comments and strings
    - prealloc       # flags slice append loops that could be pre-allocated
    - unconvert      # removes unnecessary type conversions
    - wastedassign   # catches assignments whose result is never used
    - depguard       # absolutely enforces zero third-party dependencies

  settings:
    depguard:
      rules:
        main:
          files:
            - $all
            - "!**/examples/**"
          allow:
            - $gostd   # strictly allow only the Go Standard Library
        examples:
          files:
            - "**/examples/**"
          allow:
            - $gostd
            - github.com/curfew-marathon/tickbatch
    revive:
      rules:
        - name: exported
          severity: error
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - appendAssign   # intentional in ring buffer slot recycling
    godot:
      scope: declarations
      capital: true
    misspell:
      locale: US
    govet:
      enable:
        - fieldalignment # enforces optimal memory packing for bare-metal structs

  exclusions:
    rules:
      # unsafe is explicitly mandated by the project for bare-metal serialization
      # and vectorized operations; suppress the blanket unsafe warning.
      - linters:
          - gosec
        text: "use of unsafe"

      # Padding fields ("_ [64]byte") are intentional false-sharing guards —
      # not dead code.
      - linters:
          - revive
        text: "unused-parameter"
        path: "ringbuf\\.go"

      # The [64]byte padding in ringbuf and generic slot struct cause the
      # fieldalignment analyzer to report misleading suggestions; the padding
      # is a deliberate architectural choice to prevent false sharing.
      - linters:
          - govet
        text: "fieldalignment"
        path: "ringbuf\\.go"

      # Config is an 80-byte value type passed to New[T] exactly once at
      # construction time; the copy cost is negligible and keeping it as a value
      # type avoids an extra indirection and matches the ergonomic zero-value
      # initialization pattern used throughout the test suite.
      - linters:
          - gocritic
        text: "hugeParam"
        path: "batcher\\.go"

      # External (_test package) test files must import the package under test;
      # depguard's $gostd-only rule does not apply to them.
      - linters:
          - depguard
        path: "(example|copy_sink|tcp_sink)_test\\.go"
